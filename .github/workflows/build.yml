# Baut die App fuer Windows (setup.exe) und macOS mit Apple-Chip (DMG) und testet sie.
# Bei einem Versions-Tag (z. B. v1.0.0) entsteht ein GitHub-Release mit beiden Downloads.
#
# Signieren und Notarisieren (macOS) nur bei Tags und bei Start von Hand: Nur dann
# bekommt der Job die Umgebung "release" mit den Apple-Secrets. Pull Requests nie.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: imapsync laden
        run: ./scripts/fetch-imapsync-windows.ps1
        shell: pwsh
      - name: Python-Pakete
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: App bauen
        run: pyinstaller --noconfirm mailsync.spec
      - name: Setup bauen
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import mailsync; print(mailsync.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Setup testen (still installieren)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Christinas-Mail-Sync-Setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\Christinas Mail-Sync\Christinas Mail-Sync.exe"
          if (-not (Test-Path $exe)) { Write-Error "nicht installiert: $exe"; exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\Christinas Mail-Sync.lnk")) { Write-Error "kein Desktop-Symbol"; exit 1 }
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Selbsttest der installierten App
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList '--selftest', 'selftest.txt', 'imap.gmail.com', 'outlook.office365.com' -Wait -PassThru
          Get-Content selftest.txt | Select-String -Pattern 'Exiting|SSL|error|Schluesselbund' | Select-Object -First 20
          if ($p.ExitCode -ne 0) { Get-Content selftest.txt; exit 1 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ende-zu-Ende-Test mit Test-Mailserver
        env:
          PYTHONPATH: src
        run: |
          pip install cryptography==50.0.2
          python tests/e2e.py -- "$env:INSTALLED_EXE"
      - name: Deinstallieren testen
        shell: pwsh
        run: |
          $dir = Split-Path $env:INSTALLED_EXE
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $env:INSTALLED_EXE) { Write-Error "nach dem Deinstallieren noch vorhanden"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Christinas-Mail-Sync-Setup.exe

  macos:
    runs-on: macos-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'release' || '' }}
    env:
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: imapsync bauen
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          ./scripts/build-imapsync-macos.sh
      - name: Python-Pakete
        run: pip install -r requirements.txt dmgbuild==1.6.7
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Signierzertifikat einrichten
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/macos-signing.sh setup
      - name: App bauen
        run: pyinstaller --noconfirm mailsync.spec
      - name: Selbsttest der fertigen App
        run: |
          APP="dist/Christinas Mail-Sync.app"
          codesign -v --strict --deep "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|flags' || true
          "$APP/Contents/MacOS/Christinas Mail-Sync" --selftest selftest.txt imap.gmail.com outlook.office365.com || { cat selftest.txt; exit 1; }
          grep -E 'Exiting|Schluesselbund' selftest.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ende-zu-Ende-Test mit Test-Mailserver
        env:
          PYTHONPATH: src
        run: |
          pip install cryptography==50.0.2
          python tests/e2e.py -- "dist/Christinas Mail-Sync.app/Contents/MacOS/Christinas Mail-Sync"
      # Unsigniert: DMG nur zum Testen. Signiert: Die App wird bei Apple eingereicht und
      # sofort gesichert. Den Rest (Ticket heften, DMG, Release) macht mac-release.yml,
      # sobald Apple freigibt - egal ob nach Minuten oder Tagen.
      - name: DMG bauen
        if: env.SIGN != 'true'
        run: ./scripts/package-macos.sh dmg
      - name: Bei Apple einreichen
        if: env.SIGN == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/package-macos.sh submit
      - name: Signierdaten entfernen
        if: always() && env.SIGN == 'true'
        run: ./scripts/macos-signing.sh cleanup
      - uses: actions/upload-artifact@v4
        if: env.SIGN != 'true'
        with:
          name: macos
          path: dist/Christinas-Mail-Sync.dmg
      - uses: actions/upload-artifact@v4
        if: env.SIGN == 'true'
        with:
          name: macos-signed
          path: dist/signed/
          retention-days: 90

  # Windows wird sofort veroeffentlicht; die DMG haengt mac-release.yml an,
  # sobald Apple die App freigegeben hat
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Release anlegen (Windows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber Christinas-Mail-Sync-Setup.exe
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Downloads: Windows (Setup) und macOS für Apple-Chip (DMG). Anleitung siehe README." \
              Christinas-Mail-Sync-Setup.exe
          fi
