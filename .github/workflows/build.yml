# Baut die App fuer Windows (setup.exe) und macOS mit Apple-Chip (DMG) und testet sie.
# Bei einem Versions-Tag (z. B. v1.0.0) entsteht ein GitHub-Release mit beiden Downloads.
#
# Signieren und Notarisieren (macOS) nur bei Tags und bei Start von Hand: Nur dann
# bekommt der Job die Umgebung "release" mit den Apple-Secrets. Pull Requests nie.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Workflows und Shell-Skripte statisch pruefen (actionlint ruft dabei shellcheck auf)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflows pruefen
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: Shell-Skripte pruefen
        run: shellcheck -S warning scripts/*.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: imapsync laden
        run: ./scripts/fetch-imapsync-windows.ps1
        shell: pwsh
      - name: Python-Pakete
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: App bauen
        run: pyinstaller --noconfirm mailsync.spec
      - name: Setup bauen
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import mailsync; print(mailsync.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Update-Test: Wie bei den Kollegen liegt die veroeffentlichte Version schon eingerichtet
      # auf dem Rechner (Einstellungen + Passwoerter). Die neue wird danach drueberinstalliert.
      - name: Veroeffentlichte Version installieren und einrichten
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName 2>$null
          if (-not $tag) { Write-Host "Noch kein Release - kein Update-Test"; exit 0 }
          gh release download $tag --repo $env:GITHUB_REPOSITORY -p Christinas-Mail-Sync-Setup.exe -D old
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath "old\Christinas-Mail-Sync-Setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "$tag liess sich nicht installieren"; exit 1 }
          # Einrichten wie die App selbst: settings.json in %APPDATA%, Passwoerter in der
          # Anmeldeinformationsverwaltung (nur Testwerte mit example.org)
          python -c "from mailsync import config, credentials as c; s = config.Settings(source_host='alt.example.org', source_user='update-test@example.org', target_host='neu.example.org', target_user='update-test', exclude_folders=['INBOX.Trash'], target_user_rule='localpart'); config.save_settings(s); c.set_password(s.source_host, s.source_user, 'pw1'); c.set_password(s.target_host, s.target_user, 'pw2')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Update-Test von $tag"
          "UPGRADE_FROM=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Setup testen (still installieren)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Christinas-Mail-Sync-Setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\Christinas Mail-Sync\Christinas Mail-Sync.exe"
          if (-not (Test-Path $exe)) { Write-Error "nicht installiert: $exe"; exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\Christinas Mail-Sync.lnk")) { Write-Error "kein Desktop-Symbol"; exit 1 }
          "INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Update pruefen (Einstellungen und Passwoerter noch da?)
        if: env.UPGRADE_FROM != ''
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          $p = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList '--check-setup', 'check.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "--check-setup fehlgeschlagen"; exit 1 }
          $c = Get-Content check.json | ConvertFrom-Json
          $fail = @()
          if ($c.version -ne $env:APP_VERSION) { $fail += "App-Version $($c.version) statt $env:APP_VERSION" }
          if ($c.settings.source_user -ne 'update-test@example.org' -or $c.settings.target_host -ne 'neu.example.org' `
              -or $c.settings.exclude_folders[0] -ne 'INBOX.Trash') { $fail += "Einstellungen verloren" }
          if (-not $c.source_password -or -not $c.target_password) { $fail += "Passwoerter verloren" }
          # Genau ein Eintrag unter "Apps", mit der neuen Version
          $entries = @(Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object { $_.DisplayName -eq 'Christinas Mail-Sync' })
          if ($entries.Count -ne 1) { $fail += "$($entries.Count) Eintraege unter Apps statt 1" }
          elseif ($entries[0].DisplayVersion -ne $env:APP_VERSION) { $fail += "Apps zeigt Version $($entries[0].DisplayVersion)" }
          if ($fail) { $fail | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "Update von ${env:UPGRADE_FROM} auf ${env:APP_VERSION}: Einstellungen, Passwoerter und Apps-Eintrag OK"
          # Testdaten wieder entfernen
          python -c "from mailsync import config, credentials as c; s = config.load_settings(); c.delete_password(s.source_host, s.source_user); c.delete_password(s.target_host, s.target_user)"
          Remove-Item -Force "$env:APPDATA\Christinas Mail-Sync\settings.json"
      - name: Selbsttest der installierten App
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:INSTALLED_EXE -ArgumentList '--selftest', 'selftest.txt', 'imap.gmail.com', 'outlook.office365.com' -Wait -PassThru
          Get-Content selftest.txt | Select-String -Pattern 'Exiting|SSL|error|Schluesselbund' | Select-Object -First 20
          if ($p.ExitCode -ne 0) { Get-Content selftest.txt; exit 1 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ende-zu-Ende-Test mit Test-Mailserver
        env:
          PYTHONPATH: src
        run: |
          pip install cryptography==50.0.2
          python tests/e2e.py -- "$env:INSTALLED_EXE"
      - name: Deinstallieren testen
        shell: pwsh
        run: |
          $dir = Split-Path $env:INSTALLED_EXE
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $env:INSTALLED_EXE) { Write-Error "nach dem Deinstallieren noch vorhanden"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Christinas-Mail-Sync-Setup.exe

  macos:
    runs-on: macos-latest
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'release' || '' }}
    env:
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: imapsync bauen
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          ./scripts/build-imapsync-macos.sh
      - name: Python-Pakete
        run: pip install -r requirements.txt dmgbuild==1.6.7
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Signierzertifikat einrichten
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/macos-signing.sh setup
      - name: App bauen
        run: pyinstaller --noconfirm mailsync.spec
      - name: Selbsttest der fertigen App
        run: |
          APP="dist/Christinas Mail-Sync.app"
          codesign -v --strict --deep "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|flags' || true
          "$APP/Contents/MacOS/Christinas Mail-Sync" --selftest selftest.txt imap.gmail.com outlook.office365.com || { cat selftest.txt; exit 1; }
          grep -E 'Exiting|Schluesselbund' selftest.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ende-zu-Ende-Test mit Test-Mailserver
        env:
          PYTHONPATH: src
        run: |
          pip install cryptography==50.0.2
          python tests/e2e.py -- "dist/Christinas Mail-Sync.app/Contents/MacOS/Christinas Mail-Sync"
      # Unsigniert: DMG nur zum Testen. Signiert: Die DMG wird bei Apple eingereicht und
      # sofort gesichert. Ticket anheften und veroeffentlichen macht mac-release.yml,
      # sobald Apple freigibt - egal ob nach Minuten oder Tagen.
      - name: DMG bauen
        if: env.SIGN != 'true'
        run: ./scripts/package-macos.sh dmg
      - name: DMG bauen und bei Apple einreichen
        if: env.SIGN == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/package-macos.sh submit
      - name: Signierdaten entfernen
        if: always() && env.SIGN == 'true'
        run: ./scripts/macos-signing.sh cleanup
      - uses: actions/upload-artifact@v4
        if: env.SIGN != 'true'
        with:
          name: macos
          path: dist/Christinas-Mail-Sync.dmg
      - uses: actions/upload-artifact@v4
        if: env.SIGN == 'true'
        with:
          name: macos-signed
          path: dist/signed/
          retention-days: 90

  # Windows wird sofort veroeffentlicht; die DMG haengt mac-release.yml an,
  # sobald Apple die App freigegeben hat
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Release anlegen (Windows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber Christinas-Mail-Sync-Setup.exe
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Downloads: Windows (Setup) und macOS für Apple-Chip (DMG). Anleitung siehe README." \
              Christinas-Mail-Sync-Setup.exe
          fi
