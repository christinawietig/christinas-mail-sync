# Zeigt, was Apple mit den eingereichten Notarisierungen macht (nur IDs und Status).
name: Notarisierung pruefen
on: workflow_dispatch
jobs:
  status:
    runs-on: macos-latest
    environment: release
    steps:
      - name: Status bei Apple abfragen
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$P8" > "$RUNNER_TEMP/k.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/k.p8" \
            --key-id "$(printf '%s' "$KEY_ID" | tr -d '[:space:]')" \
            --issuer "$(printf '%s' "$ISSUER" | tr -d '[:space:]')"
          rm -f "$RUNNER_TEMP/k.p8"
