# Haengt die DMG ans Release, sobald Apple sie notarisiert hat. Der Build hat die signierte
# DMG schon eingereicht und als Artifact "macos-signed" gesichert (DMG + Einreichungs-ID).
#
# Laeuft direkt nach jedem Build, alle 30 Minuten (solange einem Release die DMG fehlt)
# und von Hand. Prueft Apple noch, endet der Lauf ohne Fehler; der naechste fragt wieder.
# Lehnt Apple ab, wird das Artifact geloescht, damit nicht endlos weiter gefragt wird.
name: Mac-Release abschliessen

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build-Lauf (Nummer), leer = neuestes Release ohne DMG"
        required: false

permissions:
  contents: read

jobs:
  find:
    # Nur eigene Builds aus Tags oder Start von Hand, nie aus Pull Requests von Forks
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      artifact_id: ${{ steps.find.outputs.artifact_id }}
      sha: ${{ steps.find.outputs.sha }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          INPUT_RUN: ${{ inputs.run_id }}
        run: |
          # ID des noch gueltigen Artifacts "macos-signed" eines Laufs (oder leer)
          signed_artifact() {
            gh api "repos/$R/actions/runs/$1/artifacts" \
              -q '[.artifacts[] | select(.name == "macos-signed" and (.expired | not)) | .id][0] // empty'
          }
          has_dmg() {
            gh release view "$1" -R "$R" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'Christinas-Mail-Sync.dmg'
          }
          RUN="${EVENT_RUN:-$INPUT_RUN}"
          RUN=$(printf '%s' "$RUN" | tr -d '[:space:]')
          if [ -n "$RUN" ] && ! [[ "$RUN" =~ ^[0-9]+$ ]]; then
            echo "Build-Lauf muss eine Nummer sein" >&2; exit 1
          fi
          if [ -z "$RUN" ]; then
            # Neuestes Release ohne DMG und dessen neuester Build mit eingereichter DMG
            for t in $(gh release list -R "$R" -L 5 --json tagName -q '.[].tagName'); do
              has_dmg "$t" && continue
              for id in $(gh run list -R "$R" -w build.yml -b "$t" -e push -L 10 --json databaseId -q '.[].databaseId'); do
                if [ -n "$(signed_artifact "$id")" ]; then RUN=$id; break; fi
              done
              if [ -n "$RUN" ]; then break; fi
            done
            if [ -z "$RUN" ]; then echo "Nichts zu tun"; exit 0; fi
          fi
          ART=$(signed_artifact "$RUN")
          if [ -z "$ART" ]; then echo "Lauf $RUN hat keine eingereichte DMG - nichts zu tun"; exit 0; fi
          IFS=$'\t' read -r repo event branch sha < <(gh api "repos/$R/actions/runs/$RUN" \
            -q '[.head_repository.full_name, .event, .head_branch, .head_sha] | @tsv')
          if [ "$repo" != "$R" ]; then echo "Fremder Lauf" >&2; exit 1; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Unerwarteter Commit: $sha" >&2; exit 1; }
          # Tag-Build: DMG ans Release; sonst (Start von Hand auf main) nur als Artifact
          TAG=""
          if [ "$event" = push ] && [[ "$branch" =~ ^v[0-9A-Za-z._-]+$ ]] \
             && gh api "repos/$R/git/ref/tags/$branch" >/dev/null 2>&1; then
            TAG=$branch
            if has_dmg "$TAG"; then echo "$TAG hat schon eine DMG"; exit 0; fi
          fi
          echo "Build-Lauf $RUN, Commit $sha${TAG:+, Release $TAG}"
          {
            echo "run_id=$RUN"
            echo "artifact_id=$ART"
            echo "sha=$sha"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  finish:
    needs: find
    if: needs.find.outputs.run_id != ''
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    # Je Build-Lauf nur ein Abschluss gleichzeitig; verschiedene Laeufe stoeren sich nicht
    concurrency:
      group: mac-release-${{ needs.find.outputs.run_id }}
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ needs.find.outputs.run_id }}
      ARTIFACT_ID: ${{ needs.find.outputs.artifact_id }}
      TAG: ${{ needs.find.outputs.tag }}
      MACOS_TEAM_ID: 87884AP46G
    steps:
      # Skripte aus demselben Commit wie die eingereichte DMG
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find.outputs.sha }}
      - name: Eingereichte DMG holen
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n macos-signed -D dist/signed
      - name: Apple-Schluessel einrichten
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/macos-signing.sh notary-key
      - name: Bei Apple nachfragen, Ticket anheften
        id: pkg
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          # Direkt nach dem Build etwas warten (meist dauert es nur Minuten),
          # im 30-Minuten-Takt nur einmal nachsehen
          NOTARY_WAIT_MINUTES: ${{ github.event_name == 'schedule' && '0' || '30' }}
        run: ./scripts/package-macos.sh finish
      - name: Schluessel entfernen
        if: always()
        run: ./scripts/macos-signing.sh cleanup
      - name: Abgelehnte DMG nicht weiter versuchen
        if: failure() && steps.pkg.outputs.result == 'invalid'
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
      - name: DMG zum Release hinzufuegen
        if: steps.pkg.outputs.result == 'accepted' && env.TAG != ''
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/Christinas-Mail-Sync.dmg
      - uses: actions/upload-artifact@v4
        if: steps.pkg.outputs.result == 'accepted' && env.TAG == ''
        with:
          name: macos-dmg
          path: dist/Christinas-Mail-Sync.dmg
